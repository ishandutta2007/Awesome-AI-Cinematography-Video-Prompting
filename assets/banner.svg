<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b12" />
      <stop offset="50%" stop-color="#101426" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f355da" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.4" />
    </pattern>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
        50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.75; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes scanline {
        0% { transform: translateY(-50px); opacity: 0; }
        50% { opacity: 0.45; }
        100% { transform: translateY(450px); opacity: 0; }
      }
      @keyframes rotateRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
      .orb-2 { animation: pulseOrb 10s ease-in-out infinite 2s; transform-origin: 1050px 300px; }
      .part-1 { animation: floatParticle 6s ease-in-out infinite; }
      .part-2 { animation: floatParticle 8s ease-in-out infinite 1.5s; }
      .part-3 { animation: floatParticle 7s ease-in-out infinite 3s; }
      .scanner { animation: scanline 7s linear infinite; }
      .ring-rot { animation: rotateRing 25s linear infinite; transform-origin: 1060px 120px; }
      .dashed-path { stroke-dasharray: 8 6; animation: dashMove 3s linear infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle class="orb-1" cx="180" cy="90" r="160" fill="url(#lensGlow)" />
  <circle class="orb-2" cx="1060" cy="310" r="210" fill="url(#lensGlow)" />
  <circle cx="600" cy="210" r="280" fill="url(#lensGlow)" opacity="0.3" />

  <!-- Animated Particles in Background -->
  <circle class="part-1" cx="220" cy="340" r="2.5" fill="#38bdf8" filter="url(#subtleGlow)" />
  <circle class="part-2" cx="380" cy="80" r="3" fill="#c084fc" filter="url(#subtleGlow)" />
  <circle class="part-3" cx="890" cy="70" r="2" fill="#38bdf8" filter="url(#subtleGlow)" />
  <circle class="part-1" cx="980" cy="340" r="3.5" fill="#f43f5e" filter="url(#subtleGlow)" />
  <circle class="part-2" cx="720" cy="360" r="2" fill="#a855f7" filter="url(#subtleGlow)" />
  <circle class="part-3" cx="120" cy="220" r="2" fill="#38bdf8" />

  <!-- Cinematic Framing Bracket Elements (Corner Reticles) -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <!-- Top-Left -->
    <path d="M 35 60 L 35 35 L 60 35" fill="none" />
    <circle cx="35" cy="35" r="2" fill="#38bdf8" />
    <!-- Top-Right -->
    <path d="M 1140 35 L 1165 35 L 1165 60" fill="none" />
    <circle cx="1165" cy="35" r="2" fill="#38bdf8" />
    <!-- Bottom-Left -->
    <path d="M 35 360 L 35 385 L 60 385" fill="none" />
    <circle cx="35" cy="385" r="2" fill="#38bdf8" />
    <!-- Bottom-Right -->
    <path d="M 1140 385 L 1165 385 L 1165 360" fill="none" />
    <circle cx="1165" cy="385" r="2" fill="#38bdf8" />
  </g>

  <!-- Camera Reticle / Orbit Gizmo on Right (Pure Background Accent) -->
  <g opacity="0.45">
    <circle class="ring-rot dashed-path" cx="1060" cy="120" r="65" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="1060" cy="120" r="45" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="980" y1="120" x2="1140" y2="120" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6" />
    <line x1="1060" y1="40" x2="1060" y2="200" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6" />
    <circle cx="1060" cy="120" r="3" fill="#38bdf8" />
    <text x="1060" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle" letter-spacing="2">6-DoF CAMERA CTRL</text>
  </g>

  <!-- Dynamic Scanline Sweep (Clipped to Banner) -->
  <line class="scanner" x1="40" y1="0" x2="1160" y2="0" stroke="url(#neonCyan)" stroke-width="1.5" opacity="0.3" />

  <!-- Film Strip / Timecode Top Header Bar -->
  <g>
    <rect x="60" y="28" width="1080" height="2" fill="#1e293b" />
    <rect x="520" y="26" width="160" height="6" rx="3" fill="#38bdf8" opacity="0.6" filter="url(#subtleGlow)" />
    <!-- REC indicator -->
    <circle cx="75" cy="42" r="5" fill="#ef4444" filter="url(#subtleGlow)" />
    <text x="88" y="46" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">REC</text>
    <!-- Timecode & Specs -->
    <text x="155" y="46" fill="#94a3b8" font-family="'Courier New', Courier, monospace" font-size="12" letter-spacing="1">00:24:19:08 | 24 FPS | 8K RAW | 2.39:1 ANAMORPHIC</text>
    <text x="1115" y="46" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="end" font-weight="600" letter-spacing="1.2">AI CINEMATOGRAPHY v2.0</text>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, and Feature Badges (Always crisp & on top) -->
  <g id="foreground-titles">
    <!-- Super-header Category Tag -->
    <g transform="translate(60, 92)">
      <rect x="0" y="0" width="310" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#a855f7" />
      <text x="26" y="17" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="172" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#subtleGlow)">
      Awesome AI Cinematography
    </text>
    <text x="60" y="222" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.2">
      &amp; Video Prompting
    </text>

    <!-- Subtitle / Tagline -->
    <text x="60" y="265" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      The authoritative guide to AI film directing, camera trajectory control, local video diffusion models &amp; cinematic prompting.
    </text>
  </g>

  <!-- Foreground Interactive-style Feature Pills / Highlights -->
  <g id="feature-pills" transform="translate(60, 305)">
    <!-- Pill 1: Camera Control -->
    <g transform="translate(0, 0)">
      <rect width="185" height="42" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" opacity="0.95" />
      <text x="15" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎥 6-DoF Camera Trajectory</text>
    </g>

    <!-- Pill 2: Open Models -->
    <g transform="translate(197, 0)">
      <rect width="185" height="42" rx="10" fill="#0f172a" stroke="#7c3aed" stroke-width="1.2" opacity="0.95" />
      <text x="15" y="26" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Open Video Diffusion</text>
    </g>

    <!-- Pill 3: SaaS Suites -->
    <g transform="translate(394, 0)">
      <rect width="165" height="42" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.2" opacity="0.95" />
      <text x="15" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎬 Studio SaaS Suites</text>
    </g>

    <!-- Pill 4: Storyboarding -->
    <g transform="translate(571, 0)">
      <rect width="195" height="42" rx="10" fill="#0f172a" stroke="#d97706" stroke-width="1.2" opacity="0.95" />
      <text x="15" y="26" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📐 Film Prompt Engineering</text>
    </g>

    <!-- Pill 5: ComfyUI -->
    <g transform="translate(778, 0)">
      <rect width="175" height="42" rx="10" fill="#0f172a" stroke="#e11d48" stroke-width="1.2" opacity="0.95" />
      <text x="15" y="26" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🧩 ComfyUI Pipelines</text>
    </g>
  </g>

  <!-- Bottom Border Accent Line -->
  <line x1="30" y1="418" x2="1170" y2="418" stroke="url(#textGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
</svg>
